name: go

on:
  push:
    branches: [ main ]
    paths:
      - 'ai-gateway/**'
      - '.github/workflows/go.yml'
  pull_request:
    paths:
      - 'ai-gateway/**'
      - '.github/workflows/go.yml'

jobs:
  build-test:
    name: gateway — vet, race tests, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-gateway
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          # Stdlib-only module: no go.sum, so dependency caching has nothing to key on.
          cache: false

      - name: Formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "gofmt needed on:"; echo "$unformatted"; exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Test (race detector)
        run: go test -race ./...

      - name: Build
        run: go build ./...
